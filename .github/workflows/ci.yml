name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: pip install -r backend/requirements-dev.txt
      - run: pip install semgrep
      - run: semgrep --config auto .
      - run: flake8 backend
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: docker compose config -q
  publish:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_EXTERNAL_PUBLISH == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with: {context: ./backend, push: true, tags: "${{ secrets.DOCKERHUB_USERNAME }}/operaciones1-notes:${{ github.sha }}"}

